name: Enable GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Pages site (workflow build)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Try create
          code=$(curl -sS -o /tmp/pages-out.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}' || true)
          echo "POST status=$code"
          cat /tmp/pages-out.json || true
          echo
          if [ "$code" = "409" ] || [ "$code" = "201" ] || [ "$code" = "200" ]; then
            echo "Pages create ok or already exists"
          else
            # Try PUT update build_type
            code2=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"build_type":"workflow","source":{"branch":"main","path":"/"}}' || true)
            echo "PUT status=$code2"
            cat /tmp/pages-put.json || true
          fi
          # Set custom domain
          code3=$(curl -sS -o /tmp/pages-domain.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/sites/h5gaming6.altaimobile.com" \
            -d '{}' || true)
          echo "domain special endpoint status=$code3"
          cat /tmp/pages-domain.json || true
          # Official custom domain endpoint
          code4=$(curl -sS -o /tmp/cname.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"cname":"h5gaming6.altaimobile.com","source":{"branch":"main","path":"/"},"build_type":"workflow"}' || true)
          echo "PUT with cname status=$code4"
          cat /tmp/cname.json || true
          # GET pages
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || true
